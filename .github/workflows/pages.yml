name: Website

# Publishes site/ (the download page) to GitHub Pages whenever it or the
# changelog changes. "Какво ново" on the page comes from CHANGELOG.md.
on:
  push:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", "scripts/site-changelog.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the what's-new section from CHANGELOG.md
        run: node scripts/site-changelog.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
