[package]
name = "avtoservis"
version = "0.4.1"
description = "Управление на автосервиз"
edition = "2021"

[lib]
name = "avtoservis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
ureq = { version = "2", features = ["json"] }
pdf-extract = "0.12.1"
base64 = "0.22"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[dev-dependencies]
tempfile = "3"

[features]
# On by default so a plain `cargo run` shows the app: the screens are built
# (by build.rs) and embedded. `pnpm tauri dev` switches it off to load them
# from the Vite dev server with live reload (see scripts/tauri.mjs).
default = ["embed-frontend"]
embed-frontend = ["tauri/custom-protocol"]
